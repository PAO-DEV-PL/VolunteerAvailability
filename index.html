<!DOCTYPE html>

<html lang="pl">

    <head>

        <meta charset="UTF-8">

        <title>Volunteer Availability</title>

    </head>

    <body>

        <h1>Volunteer Availability</h1>
        
    <label for="name">Imię:</label>
    <input type="text" id="name">

    <label for="surname">Nazwisko:</label>
    <input type="text" id="surname">

        <p>Doświadczenie wolontariackie:</p>

    <label>
        <input type="radio" name="experience" value="none">
        Nie mam doświadczenia
    </label>

    <label>
        <input type="radio" name="experience" value="other">
        Pracowałem przy innych wydarzeniach
    </label>

    <label>
        <input type="radio" name="experience" value="this">
        Pracowałem już na tym wydarzeniu
    </label>
        
    </body>

</html>
