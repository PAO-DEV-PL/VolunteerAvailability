<!DOCTYPE html>

<html lang="pl">

    <head>

        <meta charset="UTF-8">

        <title>Volunteer Availability</title>

    </head>

    <body>
    
    <div id="languageSwitcher">
        <button type="button" id="plButton">🇵🇱</button>
        <button type="button" id="enButton">🇬🇧</button>
    </div>
            
    <h1 id="pageTitle"></h1>
    
    <label for="name" id="firstNameLabel"></label>
    <input type="text" id="name">
    
    <label for="surname" id="lastNameLabel"></label>
    <input type="text" id="surname">
    
    <p id="experienceLabel"></p>
    
    <label>
        <input type="radio" name="experience" value="none">
        <span id="noExperience"></span>
    </label>
    
    <label>
        <input type="radio" name="experience" value="other">
        <span id="otherEvents"></span>
    </label>
    
    <label>
        <input type="radio" name="experience" value="this">
        <span id="thisEvent"></span>
    </label>
    
    <div id="availability"></div>    
    <script>
        const translations = {
            pl: {
                locale: "pl-PL",
                pageTitle: "Formularz wolontariusza",
                firstName: "Imię:",
                lastName: "Nazwisko:",
                experience: "Doświadczenie wolontariackie:",
                noExperience: "Nie mam doświadczenia",
                otherEvents: "Pracowałem przy innych wydarzeniach",
                thisEvent: "Pracowałem już na tym wydarzeniu",
                time: "Godzina:"
            },
        
            en: {
                locale: "en-GB",
                pageTitle: "Volunteer Form",
                firstName: "First name:",
                lastName: "Last name:",
                experience: "Volunteer experience:",
                noExperience: "No experience",
                otherEvents: "I worked at other events",
                thisEvent: "I have already worked at this event",
                time: "Time:"
            }
        };
        
        const eventStructure = {
            shiftLength: 60,
        
            days: [
                {
                    date: "2026-09-12",
                    start: "08:00",
                    end: "20:00"
                },
                {
                    date: "2026-09-13",
                    start: "08:00",
                    end: "18:00"
                }
            ]
        };
        
        let currentLanguage = "pl";
        const availabilityState = {};
        const availability = document.getElementById("availability");
        function renderAvailabilityTable() {
            availability.innerHTML = "";
        
            const table = document.createElement("table");
            availability.appendChild(table);
        
            const headerRow = document.createElement("tr");
            table.appendChild(headerRow);
        
            const timeHeader = document.createElement("th");
            timeHeader.textContent = translations[currentLanguage].time;
            headerRow.appendChild(timeHeader);
        
            for (const day of eventStructure.days) {
                const dayHeader = document.createElement("th");
        
                const date = new Date(day.date + "T00:00:00");
        
                const dayName = new Intl.DateTimeFormat(
                    translations[currentLanguage].locale,
                    { weekday: "long" }
                ).format(date);
        
                dayHeader.textContent = dayName;
                headerRow.appendChild(dayHeader);
            }
        
            const firstDay = eventStructure.days[0];
        
            const [startHour, startMinute] = firstDay.start.split(":").map(Number);
            const [endHour, endMinute] = firstDay.end.split(":").map(Number);
        
            let currentMinutes = startHour * 60 + startMinute;
            const endMinutes = endHour * 60 + endMinute;
        
            while (currentMinutes < endMinutes) {
                const row = document.createElement("tr");
                table.appendChild(row);
        
                const hourCell = document.createElement("td");
        
                const hours = Math.floor(currentMinutes / 60);
                const minutes = currentMinutes % 60;
        
                const formattedTime =
                    String(hours).padStart(2, "0") +
                    ":" +
                    String(minutes).padStart(2, "0");
        
                hourCell.textContent = formattedTime;
                row.appendChild(hourCell);
        
                for (const day of eventStructure.days) {
                    const cell = document.createElement("td");
                    row.appendChild(cell);
                }
        
                currentMinutes += eventStructure.shiftLength;
            }
        }
        
    function updateLanguage() {
        const language = translations[currentLanguage];
    
        document.getElementById("pageTitle").textContent = language.pageTitle;
        document.getElementById("firstNameLabel").textContent = language.firstName;
        document.getElementById("lastNameLabel").textContent = language.lastName;
        document.getElementById("experienceLabel").textContent = language.experience;
        document.getElementById("noExperience").textContent = language.noExperience;
        document.getElementById("otherEvents").textContent = language.otherEvents;
        document.getElementById("thisEvent").textContent = language.thisEvent;

    }
    
    updateLanguage();
    renderAvailabilityTable();
        
    document.getElementById("plButton").addEventListener("click", function () {
        currentLanguage = "pl";
        updateLanguage();
    });
    
    document.getElementById("enButton").addEventListener("click", function () {
        currentLanguage = "en";
        updateLanguage();
    });
        
    </script>
    
    
    </body>

</html>
